name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"    # tiap hari jam 00:00 UTC
  push:
    branches:
      - main               # ganti ke "master" kalau default branch kamu masih master
  workflow_dispatch: {}    # biar bisa di-trigger manual dari tab Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/[email protected]
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/[email protected]
        with:
          push_branch: output
          commit_message: "chore: update snake animation"
          local_path: dist
