name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply custom snake gradient
        run: |
          sudo chown -R $USER:$USER dist
          node -e '
            const fs = require("fs");
            const lightGradient = `<defs><linearGradient id="snake-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#72695c"/><stop offset="50%" stop-color="#72695c"/><stop offset="75%" stop-color="#c4bbb0"/><stop offset="100%" stop-color="#ffffff"/></linearGradient></defs>`;
            const darkGradient = `<defs><linearGradient id="snake-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="50%" stop-color="#ffffff"/><stop offset="75%" stop-color="#c4bbb0"/><stop offset="100%" stop-color="#72695c"/></linearGradient></defs>`;
            
            const configs = [
              { file: "dist/github-contribution-grid-snake.svg", grad: lightGradient },
              { file: "dist/github-contribution-grid-snake-dark.svg", grad: darkGradient }
            ];

            configs.forEach(({ file, grad }) => {
              if (fs.existsSync(file)) {
                let content = fs.readFileSync(file, "utf8");
                content = content.replace("</desc>", "</desc>" + grad);
                content = content.replace(/--cs:[^;]+;/, "--cs:url(#snake-gradient);");
                content = content.replace(".s{shape-rendering:geometricPrecision;fill:var(--cs);", ".s{shape-rendering:geometricPrecision;fill:url(#snake-gradient);");
                fs.writeFileSync(file, content);
              }
            });
          '

      - name: Push snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
