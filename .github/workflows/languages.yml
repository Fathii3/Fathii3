name: Generate Language Graph
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: "" 
          
          # Pengaturan Bahasa
          plugin_languages: yes
          plugin_languages_limit: 0 # Angka 0 akan memaksa sistem menampilkan SEMUA bahasa
          plugin_languages_details: percentage # Hanya persentase agar rapi
          plugin_languages_indepth: no # Dimatikan agar membaca seluruh repo, bukan hanya commit terakhir
          
          config_transparent: yes
