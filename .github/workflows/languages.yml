name: Generate Language Graph
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: "" 
          
          # Pengaturan Bahasa Paksa Tampil Semua
          plugin_languages: yes
          plugin_languages_limit: 10 # Menampilkan hingga 10 bahasa
          plugin_languages_threshold: 0% # Memaksa bahasa dengan persentase sekecil apa pun tetap muncul
          plugin_languages_details: percentage
          
          config_transparent: yes
